name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create GitHub releases + upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p laya-decision-cli -p laya-decision-serve

      - name: Package archive
        shell: bash
        run: |
          dist="laya-decision-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/laya" "$dist/"
          cp "target/${{ matrix.target }}/release/laya-serve" "$dist/"
          cp README.md LICENSE NOTICE "$dist/"
          tar -czf "${dist}.tar.gz" "$dist"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: laya-decision-*.tar.gz
          generate_release_notes: true

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches crate version
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="laya-decision") | .version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "::error::tag $tag does not match crate version $ver — bump the workspace version before tagging."
            exit 1
          fi
          echo "publishing version $ver"

      # Publishes the library first, then the dependents (which reference it by version).
      # `cargo publish` waits for each crate to appear in the index before returning, so the
      # dependents resolve the freshly published library. Skipped if the token secret is unset.
      - name: Publish crates (dependency order)
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish -p laya-decision
          # --no-verify on the dependents: they package fine without resolving the just-published
          # library from the index (avoids a propagation race), and CI already verified they build.
          cargo publish -p laya-decision-cli --no-verify
          cargo publish -p laya-decision-serve --no-verify

      - name: Token missing
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "::warning::CARGO_REGISTRY_TOKEN secret not set — skipping crates.io publish."
